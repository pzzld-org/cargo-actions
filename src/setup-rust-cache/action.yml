name: Cargo Cache
description: Configure shared sccache compiler caching and Cargo dependency caching for Rust jobs.
author: pzzld-org

inputs:
  key:
    description: Stable cache key shared by compatible jobs or matrix legs.
    required: true
  workspaces:
    description: Cargo workspace roots passed to Swatinem/rust-cache, one workspace specification per line.
    required: false
    default: '.'

  save-if:
    description: Opt in to cache writes on default-branch push events only. Other events always restore only.
    required: false
    default: 'false'
  sccache:
    description: Enable pinned sccache with READ_ONLY or READ_WRITE matching the dependency write policy.
    required: false
    default: 'true'

outputs:
  write-enabled:
    description: Whether this action permits dependency cache writes for this event; not proof that a save occurred.
    value: ${{ steps.policy.outputs.write-enabled }}
  sccache-mode:
    description: READ_ONLY, READ_WRITE, or disabled, as configured by this action.
    value: ${{ steps.policy.outputs.sccache-mode }}
  sccache-enabled:
    description: Whether this action configures the compiler cache; not a compiler hit count.
    value: ${{ steps.policy.outputs.sccache-enabled }}
  cache-hit:
    description: Whether rust-cache restored an exact dependency-cache match.
    value: ${{ steps.rust-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Resolve cache policy
      id: policy
      shell: bash
      env:
        CARGO_ACTION_CACHE_KEY: ${{ inputs.key }}
        CARGO_ACTION_CACHE_SAVE: ${{ inputs.save-if }}
        CARGO_ACTION_SCCACHE: ${{ inputs.sccache }}
        CARGO_ACTION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash "${GITHUB_ACTION_PATH}/../_shared/cache-policy.sh"

    - name: Setup sccache
      if: steps.policy.outputs.sccache-enabled == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.17.0

    - name: Enable sccache GitHub Actions backend
      if: steps.policy.outputs.sccache-enabled == 'true'
      shell: bash
      env:
        SCCACHE_GHA_RW_MODE: ${{ steps.policy.outputs.sccache-mode }}
      run: |
        echo "SCCACHE_GHA_RW_MODE=${SCCACHE_GHA_RW_MODE}" >> "${GITHUB_ENV}"
        echo "RUSTC_WRAPPER=sccache" >> "${GITHUB_ENV}"
        echo "SCCACHE_GHA_ENABLED=true" >> "${GITHUB_ENV}"

    - name: Setup Rust dependency cache
      id: rust-cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.key }}
        cache-targets: 'false'
        cache-bin: 'false'
        save-if: ${{ steps.policy.outputs.write-enabled }}
        workspaces: ${{ inputs.workspaces }}
