name: Cargo Cache
description: Enable shared sccache compiler caching and Rust dependency caching.

inputs:
  key:
    description: Stable cache key for this job or matrix leg.
    required: true
  workspaces:
    description: Cargo workspace root(s) to cache, relative to the job workspace.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

    - name: Enable sccache GitHub Actions backend
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> "${GITHUB_ENV}"
        echo "SCCACHE_GHA_ENABLED=true" >> "${GITHUB_ENV}"

    - name: Setup Rust dependency cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: ${{ inputs.key }}
        cache-targets: false
        workspaces: ${{ inputs.workspaces }}
